<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aaharGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#115E59" stop-opacity="0.03" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect width="800" height="500" fill="url(#aaharGrad)" />
  <path d="M 0,0 L 800,0 L 800,500 Z" fill="#0F766E" fill-opacity="0.01" />
  
  <!-- Decorative Grid -->
  <g stroke="#E5E5E5" stroke-width="0.5" stroke-opacity="0.5">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
  
  <!-- Project Branding Illustration -->
  <g transform="translate(400, 220)">
    <!-- Plate circle -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#0F766E" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#0F766E" stroke-width="1" stroke-opacity="0.2" />
    
    <!-- Stylized Fork and Knife icons in center -->
    <!-- Fork -->
    <path d="M -25,25 L -25,-10 M -33,-10 L -33,-35 M -25,-10 L -25,-35 M -17,-10 L -17,-35 M -33,-10 C -33,5 -17,5 -17,-10 Z" fill="none" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knife -->
    <path d="M 25,25 L 25,-35 C 25,-35 15,-32 15,-20 L 15,25 Z" fill="#0F766E" fill-opacity="0.8" stroke="#0F766E" stroke-width="2" stroke-linejoin="round" />
  </g>
  
  <!-- Brand text -->
  <text x="400" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#171717" text-anchor="middle" letter-spacing="2">AAHAR</text>
  <text x="400" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#0F766E" text-anchor="middle" letter-spacing="1">THE FOOD LEGACY</text>
  <text x="400" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#666666" text-anchor="middle">Restaurant Website · WordPress &amp; Elementor</text>
</svg>
