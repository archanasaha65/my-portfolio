<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="#FFFFFF" />
  <rect width="800" height="500" fill="url(#adminGrad)" />
  
  <!-- Dashboard UI Frame -->
  <g transform="translate(100, 80)">
    <!-- Browser/App Container shadow -->
    <rect x="-5" y="-5" width="610" height="350" rx="10" fill="#171717" fill-opacity="0.05" />
    <rect x="0" y="0" width="600" height="340" rx="8" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5" />
    
    <!-- Browser Header -->
    <path d="M 0,8 A 8,8 0 0,1 8,0 L 592,0 A 8,8 0 0,1 600,8 L 600,32 L 0,32 Z" fill="#F8F7F4" stroke="#E5E5E5" stroke-width="1" />
    <!-- Window dots -->
    <circle cx="15" cy="16" r="5" fill="#E5E5E5" />
    <circle cx="30" cy="16" r="5" fill="#E5E5E5" />
    <circle cx="45" cy="16" r="5" fill="#E5E5E5" />
    <rect x="75" y="8" width="120" height="16" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="0.5" />
    
    <!-- Dashboard Sidebar -->
    <rect x="0" y="32" width="120" height="308" fill="#F8F7F4" stroke="#E5E5E5" stroke-width="0.5" />
    <rect x="15" y="52" width="90" height="12" rx="3" fill="#0F766E" fill-opacity="0.15" />
    <rect x="15" y="80" width="90" height="10" rx="3" fill="#E5E5E5" />
    <rect x="15" y="104" width="90" height="10" rx="3" fill="#E5E5E5" />
    <rect x="15" y="128" width="90" height="10" rx="3" fill="#E5E5E5" />
    
    <!-- Main Content Area -->
    <!-- Heading -->
    <rect x="145" y="52" width="180" height="16" rx="4" fill="#171717" />
    
    <!-- Grid of Dashboard Widgets -->
    <!-- Widget 1: Graph -->
    <rect x="145" y="88" width="285" height="120" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    <path d="M 160,180 L 200,140 L 240,160 L 280,110 L 320,130 L 360,98 L 400,120" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />
    <circle cx="360" cy="98" r="4.5" fill="#0F766E" />
    <circle cx="400" cy="120" r="4.5" fill="#0F766E" />
    
    <!-- Widget 2: Stats -->
    <rect x="445" y="88" width="140" height="54" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    <rect x="460" y="102" width="60" height="10" rx="2" fill="#666666" fill-opacity="0.5" />
    <rect x="460" y="120" width="80" height="14" rx="3" fill="#0F766E" />
    
    <rect x="445" y="154" width="140" height="54" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    <rect x="460" y="168" width="80" height="10" rx="2" fill="#666666" fill-opacity="0.5" />
    <rect x="460" y="186" width="60" height="14" rx="3" fill="#171717" />
    
    <!-- Bottom Grid lists -->
    <rect x="145" y="224" width="440" height="96" rx="6" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    <line x1="145" y1="256" x2="585" y2="256" stroke="#E5E5E5" stroke-width="1" />
    <line x1="145" y1="288" x2="585" y2="288" stroke="#E5E5E5" stroke-width="1" />
    <rect x="160" y="238" width="120" height="8" rx="2" fill="#171717" />
    <rect x="160" y="268" width="90" height="8" rx="2" fill="#666666" fill-opacity="0.5" />
    <rect x="160" y="300" width="140" height="8" rx="2" fill="#666666" fill-opacity="0.5" />
  </g>
  
  <!-- Info Overlay/Text -->
  <text x="400" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#171717" text-anchor="middle">Restaurant Management Dashboard</text>
  <text x="400" y="480" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#666666" text-anchor="middle">Next.js · React · TypeScript · REST API · Dashboard</text>
</svg>
