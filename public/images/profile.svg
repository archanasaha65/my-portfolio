<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFDFD" />
      <stop offset="100%" stop-color="#F8F7F4" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  
  <!-- Abstract Geometric Details -->
  <circle cx="200" cy="220" r="160" fill="none" stroke="#E5E5E5" stroke-width="1" />
  <circle cx="200" cy="220" r="140" fill="none" stroke="#0F766E" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4,8" />
  
  <!-- Stylized avatar/portrait -->
  <!-- Shadow/Glow -->
  <circle cx="200" cy="210" r="85" fill="#171717" fill-opacity="0.03" />
  <!-- Main circle for avatar -->
  <circle cx="200" cy="205" r="80" fill="url(#avatarGrad)" />
  
  <!-- Initials text inside avatar -->
  <text x="200" y="222" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle">AS</text>
  
  <!-- Subtitle Text -->
  <text x="200" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#171717" text-anchor="middle">Archana Saha</text>
  <text x="200" y="370" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#666666" text-anchor="middle">Senior Frontend &amp; WordPress Developer</text>
  
  <!-- Accents/Status -->
  <g transform="translate(140, 410)">
    <rect width="120" height="28" rx="14" fill="#171717" />
    <circle cx="20" cy="14" r="4" fill="#2DD4BF" />
    <text x="70" y="19" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">AVAILABLE NOW</text>
  </g>
</svg>
